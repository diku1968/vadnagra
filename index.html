<div id="updateNotification" class="update-notification">

<div class="birthday-button-container">

  <button onclick="loadFromGoogleSheet()" style="background:#e6f0ff;">🔄 Reload from sheet (450+)</button>
</div>

<input class="search" id="search" placeholder="🔍 Search name, phone, family, place...">

<div id="list" class="loading">⏳ Loading 450+ contacts from Google Sheet...</div>
<div class="footer-note">⚡ live from Google Sheets · updates automatically</div>

<script>
// ----------------------------------------------
// CONFIGURATION - Google Sheet as public CSV
// ----------------------------------------------
const SHEET_ID = '1jVliDZD3_bu9Xb3ZRfDkxEXTO4AObSpXiMqjHqVQVrU';
const SHEET_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

// ----------------------------------------------
// DATA LAYER
// ----------------------------------------------
let contacts = [];
let isLoading = false;
let todayBirthdays = [];
let monthBirthdays = [];
let lastUpdateCheck = 0;
let updateAvailable = false;

// Load from localStorage first for speed
function loadLocalOrDefault() {
  const stored = localStorage.getItem("nagar_contacts_full");
  if (stored) {
    try {
      contacts = JSON.parse(stored);
      console.log(`Loaded ${contacts.length} contacts from cache`);
      
      // Check last update time
      lastUpdateCheck = parseInt(localStorage.getItem("nagar_last_update")) || 0;
    } catch(e) { 
      contacts = []; 
    }
  }
  
  // If no cache or empty, show sample until real data loads
  if (!contacts || contacts.length === 0) {
    contacts = getSampleContacts();
    saveToLocal();
  }
}

function getSampleContacts() {
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  
  return [
    {name:"Amit S Acharya",phone:"9429119209",place:"Ahmedabad",family:"Acharya",birthday:""},
    {name:"Ankur Acharya",phone:"9825230512",place:"Bhuj",family:"Acharya",birthday:"1973-12-12"},
    {name:"Bimal Acharya",phone:"9825736190",place:"Bhuj",family:"Acharya",birthday:todayStr},
    {name:"Dhara B Acharya",phone:"9409087848",place:"Bhuj",family:"Acharya",birthday:""},
    {name:"Dr. Rajesh Trivedi",phone:"9876543210",place:"Mumbai",family:"Trivedi",birthday:"1980-05-21"},
    {name:"Priya Mehta",phone:"9876543211",place:"Ahmedabad",family:"Mehta",birthday:todayStr},
    {name:"Rakesh Joshi",phone:"9876543212",place:"Surat",family:"Joshi",birthday:"1985-03-15"},
    {name:"Kirit Pathak",phone:"9876543213",place:"Ahmedabad",family:"Pathak",birthday:todayStr}
  ];
}

function saveToLocal() {
  localStorage.setItem("nagar_contacts_full", JSON.stringify(contacts));
  localStorage.setItem("nagar_last_update", Date.now().toString());
  document.getElementById('total').innerText = 'Total members: ' + contacts.length;
}

// ----------------------------------------------
// LOAD FROM GOOGLE SHEET
// ----------------------------------------------
async function loadFromGoogleSheet(showUpdateNotification = false) {
  if (isLoading) return;
  
  isLoading = true;
  if (!showUpdateNotification) {
    document.getElementById('list').innerHTML = '<div class="loading">⏳ Loading 450+ contacts from Google Sheet...</div>';
  }
  
  try {
    const proxyUrl = 'https://api.allorigins.win/raw?url=';
    const response = await fetch(proxyUrl + encodeURIComponent(SHEET_CSV_URL));
    
    if (!response.ok) throw new Error('Failed to fetch');
    
    const csvText = await response.text();
    const parsedContacts = parseCSV(csvText);
    
    if (parsedContacts.length > 0) {
      // Check if new contacts were added
      const oldCount = contacts.length;
      const newCount = parsedContacts.length;
      
      if (newCount > oldCount && showUpdateNotification) {
        // Show update notification
        document.getElementById('updateNotification').style.display = 'flex';
        updateAvailable = true;
      }
      
      contacts = parsedContacts;
      saveToLocal();
      
      display(contacts);
      updateBirthdays();
      
      if (!showUpdateNotification) {
        alert(`✅ Successfully loaded ${contacts.length} contacts from Google Sheet!`);
      }
    } else {
      throw new Error('No contacts found in CSV');
    }
  } catch (error) {
    console.error('Error loading sheet:', error);
    if (!showUpdateNotification) {
      document.getElementById('list').innerHTML = '';
      display(contacts);
      tryAlternateFetch();
    }
  } finally {
    isLoading = false;
  }
}

// Update app when new version is available
function updateApp() {
  document.getElementById('updateNotification').style.display = 'none';
  updateAvailable = false;
  loadFromGoogleSheet(false); // Reload with full loading screen
}

async function tryAlternateFetch() {
  try {
    const response = await fetch(SHEET_CSV_URL);
    if (!response.ok) throw new Error('Failed');
    
    const csvText = await response.text();
    const parsedContacts = parseCSV(csvText);
    
    if (parsedContacts.length > 0) {
      contacts = parsedContacts;
      saveToLocal();
      display(contacts);
      updateBirthdays();
      alert(`✅ Successfully loaded ${contacts.length} contacts!`);
    }
  } catch (e) {
    console.log('Alternate fetch also failed, using cached data');
    
    if (contacts.length <= 5) {
      document.getElementById('list').innerHTML = '';
      display(contacts);
      updateBirthdays();
      
      const statsDiv = document.createElement('div');
      statsDiv.className = 'stats';
      statsDiv.innerHTML = '⚠️ To load all 450+ contacts, publish your sheet:<br>1. File → Share → Publish to web<br>2. Choose CSV format<br>3. Click Publish';
      document.getElementById('list').prepend(statsDiv);
    }
  }
}

function parseCSV(csvText) {
  const lines = csvText.split('\n');
  if (lines.length < 2) return [];
  
  const headers = lines[0].split(',').map(h => 
    h.replace(/["']/g, '').trim().toLowerCase()
  );
  
  const nameIndex = headers.findIndex(h => h.includes('name'));
  const phoneIndex = headers.findIndex(h => h.includes('phone') || h.includes('mobile') || h.includes('contact'));
  const placeIndex = headers.findIndex(h => h.includes('place') || h.includes('city') || h.includes('location'));
  const familyIndex = headers.findIndex(h => h.includes('family') || h.includes('surname') || h.includes('gotra'));
  const birthdayIndex = headers.findIndex(h => h.includes('birth') || h.includes('dob') || h.includes('date'));
  
  const contacts = [];
  
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    
    const values = lines[i].split(',').map(v => v.replace(/["']/g, '').trim());
    
    if (values.length < 2) continue;
    
    const contact = {
      name: nameIndex >= 0 ? values[nameIndex] || '' : '',
      phone: phoneIndex >= 0 ? values[phoneIndex] || '' : '',
      place: placeIndex >= 0 ? values[placeIndex] || '' : '',
      family: familyIndex >= 0 ? values[familyIndex] || 'Other' : 'Other',
      birthday: birthdayIndex >= 0 ? values[birthdayIndex] || '' : ''
    };
    
    if (contact.name && contact.name.length > 0) {
      // Clean phone number - remove all non-digits
      contact.phone = contact.phone.replace(/\D/g, '');
      contacts.push(contact);
    }
  }
  
  return contacts;
}

// ----------------------------------------------
// Birthday Functions
// ----------------------------------------------
function updateBirthdays() {
  let today = new Date();
  let currentMonth = today.getMonth();
  let currentDay = today.getDate();

  // Find today's birthdays
  todayBirthdays = contacts.filter(c => {
    if (!c.birthday) return false;
    let b = new Date(c.birthday);
    return !isNaN(b.getTime()) && b.getDate() === currentDay && b.getMonth() === currentMonth;
  });

  // Find month birthdays (excluding today's)
  monthBirthdays = contacts.filter(c => {
    if (!c.birthday) return false;
    let b = new Date(c.birthday);
    if (isNaN(b.getTime())) return false;
    
    // Check if it's same month but not today
    return b.getMonth() === currentMonth && b.getDate() !== currentDay;
  });

  // Update birthday count button
  document.getElementById('birthdayCount').textContent = monthBirthdays.length + todayBirthdays.length;
  
  // Prepare birthday list for popup
  let birthdayHtml = '';
  
  if (todayBirthdays.length > 0) {
    birthdayHtml += '<h3 style="color:#f44336; margin:10px 0;">🔥 Today</h3>';
    todayBirthdays.forEach(c => {
      let initials = c.name.split(' ').map(x => x[0]).join('').toUpperCase().substring(0,2);
      let formattedDate = formatDate(c.birthday);
      birthdayHtml += `
        <div class="birthday-item today">
          <div class="avatar-small">${initials}</div>
          <div class="info">
            <b>${c.name}</b><br>
            <span class="date">🎂 ${formattedDate}</span>
          </div>
        </div>
      `;
    });
  }
  
  if (monthBirthdays.length > 0) {
    birthdayHtml += '<h3 style="color:#ff9800; margin:10px 0;">📅 This Month</h3>';
    monthBirthdays.forEach(c => {
      let initials = c.name.split(' ').map(x => x[0]).join('').toUpperCase().substring(0,2);
      let formattedDate = formatDate(c.birthday);
      birthdayHtml += `
        <div class="birthday-item">
          <div class="avatar-small">${initials}</div>
          <div class="info">
            <b>${c.name}</b><br>
            <span class="date">🎂 ${formattedDate}</span>
          </div>
        </div>
      `;
    });
  }
  
  if (todayBirthdays.length === 0 && monthBirthdays.length === 0) {
    birthdayHtml = '<p style="text-align:center; color:#647b9a;">No birthdays this month</p>';
  }

function formatDate(dStr) {
  if (!dStr) return '';
  
  let d = new Date(dStr);
  if (isNaN(d.getTime())) {
    const parts = dStr.split(/[\/\-\.]/);
    if (parts.length === 3) {
      d = new Date(parts[2], parts[1]-1, parts[0]);
    }
  }
  
  if (isNaN(d.getTime())) return dStr;
  return d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
}

function isTodayBirthday(contact) {
  if (!contact.birthday) return false;
  let today = new Date();
  let b = new Date(contact.birthday);
  if (isNaN(b.getTime())) return false;
  return b.getDate() === today.getDate() && b.getMonth() === today.getMonth();
}

}

function shareContact(name) {
  const contact = contacts.find(c => c.name === name);
  if (contact && navigator.share) {
    navigator.share({
      title: contact.name,
      text: `Name: ${contact.name}\nPhone: ${contact.phone}\nPlace: ${contact.place || '—'}`,
    }).catch(console.error);
  } else {
    alert(`Share this contact:\n\n${contact.name}\n${contact.phone}`);
  }
  return false;
}

document.getElementById('search').addEventListener('keyup', function() {
  let q = this.value.toLowerCase().trim();
  if (q === '') {
    display(contacts);
    return;
  }
  let filtered = contacts.filter(c =>
    (c.name || '').toLowerCase().includes(q) ||
    (c.phone || '').includes(q) ||
    (c.family || '').toLowerCase().includes(q) ||
    (c.place || '').toLowerCase().includes(q)
  );
  display(filtered);
});

function exportCSV() {
  let csv = "Name,Phone,Place,Family,Birthday\n";
  contacts.forEach(c => {
    csv += `"${c.name}","${c.phone}","${c.place || ''}","${c.family || ''}","${c.birthday || ''}"\n`;
  });
  download(csv, 'contacts.csv', 'text/csv');
}

function exportVCF() {
  let vcf = '';
  contacts.forEach(c => {
    vcf += `BEGIN:VCARD\nVERSION:3.0\nFN:${c.name}\nTEL:${c.phone}\nEND:VCARD\n`;
  });
  download(vcf, 'contacts.vcf', 'text/vcard');
}

function backup() {
  download(JSON.stringify(contacts, null, 2), 'backup.json', 'application/json');
}

function download(content, filename, type) {
  let blob = new Blob([content], { type });
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ----------------------------------------------
// PWA Service Worker Registration
// ----------------------------------------------
let deferredPrompt;

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(registration => {
        console.log('✅ Service Worker registered successfully');
        
        // Check for updates every hour
        setInterval(() => {
          registration.update();
        }, 60 * 60 * 1000);
        
        // Listen for new service worker
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          console.log('🔄 New version installing...');
          
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              // New version available
              document.getElementById('updateNotification').style.display = 'flex';
            }
          });
        });
      })
      .catch(error => {
        console.log('❌ Service Worker registration failed:', error);
      });
      
    // Listen for controller change (update activated)
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      console.log('New service worker activated');
      window.location.reload();
    });
  });
}

// Before install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  // Show install button
  const installBtn = document.getElementById('install-btn');
  if (installBtn) {
    installBtn.style.display = 'inline-block';
  }
});

// Install button click handler
document.getElementById('install-btn')?.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log(`User ${outcome} the installation`);
  
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});

// After installation
window.addEventListener('appinstalled', () => {
  console.log('✅ App was installed successfully');
  deferredPrompt = null;
  document.getElementById('install-btn').style.display = 'none';
});
